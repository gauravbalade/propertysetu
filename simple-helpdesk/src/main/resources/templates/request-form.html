<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${pageTitle}">Request form</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><div><span class="brand-mark">H</span><span class="brand">Simple Helpdesk</span></div><a class="top-link" th:href="@{/}">← Back to requests</a></header>
<main class="container form-container"><section class="form-intro"><p class="eyebrow">REQUEST DETAILS</p><h1 th:text="${pageTitle}">Create a request</h1><p class="muted">Enter the details below. Required fields are marked.</p></section>
<form class="panel request-form" th:action="@{/requests/save}" th:object="${request}" method="post">
<input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{createdAt}">
<div class="field"><label for="title">Request title *</label><input id="title" type="text" th:field="*{title}" placeholder="e.g. Classroom projector not working"><small class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small></div>
<div class="field"><label for="requesterName">Your name *</label><input id="requesterName" type="text" th:field="*{requesterName}" placeholder="Enter your name"><small class="error" th:if="${#fields.hasErrors('requesterName')}" th:errors="*{requesterName}"></small></div>
<div class="field"><label for="category">Category *</label><select id="category" th:field="*{category}"><option value="">Choose a category</option><option>IT Support</option><option>Facilities</option><option>Administration</option><option>Classroom</option><option>Other</option></select><small class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small></div>
<div class="field"><label for="description">Description *</label><textarea id="description" rows="5" th:field="*{description}" placeholder="Explain the issue or service you need"></textarea><small class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small></div>
<div class="field" th:if="${request.id != null}"><label for="status">Status</label><select id="status" th:field="*{status}"><option value="OPEN">Open</option><option value="IN_PROGRESS">In progress</option><option value="CLOSED">Closed</option></select></div>
<div class="form-actions"><a class="button secondary" th:href="@{/}">Cancel</a><button class="button primary" type="submit">Save request</button></div></form><footer>Simple Helpdesk · Academic demonstration project</footer></main></body></html>
