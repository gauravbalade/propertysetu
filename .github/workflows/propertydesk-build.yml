name: PropertyDesk build
on:
  push:
    paths:
      - "PropertyDesk/**"
      - ".github/workflows/propertydesk-build.yml"
  pull_request:
    paths:
      - "PropertyDesk/**"
      - ".github/workflows/propertydesk-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PropertyDesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build project
        run: mvn -B -DskipTests package
